# Vendor approval. Shows regex validation, sanctions screening, category-specific
# conditional rule and a reject-on-duplicate business key (same tax id).
workflow: vendor_approval
version: 1
owner: procurement
description: Supplier onboarding with sanctions screening and contract-value based approval routing.

input_schema:
  type: object
  additionalProperties: false
  required: [vendor, requested_by]
  properties:
    requested_by: {type: string, minLength: 1}
    vendor:
      type: object
      additionalProperties: false
      required: [name, country, tax_id, category, annual_contract_value, bank_account_verified]
      properties:
        name: {type: string, minLength: 2}
        country: {type: string, pattern: "^[A-Z]{2}$"}
        tax_id: {type: string}
        category: {enum: [it_services, facilities, logistics, consulting, raw_materials]}
        annual_contract_value: {type: number, minimum: 0}
        bank_account_verified: {type: boolean}
        certifications:
          type: array
          items: {type: string}

parameters:
  tax_id_pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]$"
  committee_threshold: 1000000
  it_security_threshold: 250000

dependencies:
  sanctions:
    type: sanctions_screen
    timeout_ms: 1000
    retry: {max_attempts: 3, base_delay_ms: 100, max_delay_ms: 500}

duplicate_check:
  fields: [vendor.tax_id]
  window_hours: 8760
  action: reject

stages:
  - id: kyc_checks
    type: rules
    rules:
      - id: VND-001
        name: Tax id well-formed (GSTIN)
        kind: mandatory
        condition: "matches(input.vendor.tax_id, params.tax_id_pattern)"
        on_fail: reject
        reason: "Tax id '{input.vendor.tax_id}' is not a valid GSTIN"
      - id: VND-002
        name: Bank account verified
        kind: mandatory
        condition: "input.vendor.bank_account_verified"
        on_fail: review
        reason: "Vendor bank account has not been verified (penny-drop pending)"
      - id: VND-003
        name: ISO 27001 for significant IT suppliers
        kind: conditional
        when: "input.vendor.category == 'it_services' and input.vendor.annual_contract_value > params.it_security_threshold"
        condition: "exists(input.vendor.certifications) and 'ISO27001' in input.vendor.certifications"
        on_fail: review
        reason: "IT supplier above {params.it_security_threshold} without ISO 27001 needs security review"
    next: sanctions_screening

  - id: sanctions_screening
    type: dependency
    dependency: sanctions
    request:
      vendor_name: "input.vendor.name"
      country: "input.vendor.country"
    output_key: sanctions
    on_unavailable: retry_later
    on_error: manual_review
    next: sanctions_rules

  - id: sanctions_rules
    type: rules
    evaluation: first_failure
    rules:
      - id: SAN-001
        name: No sanctions match
        kind: mandatory
        condition: "sanctions.match == false"
        on_fail: reject
        reason: "Vendor matched a sanctions list ({sanctions.lists_checked})"
    next: approval_routing

  - id: approval_routing
    type: branch
    branches:
      - label: procurement committee
        when: "input.vendor.annual_contract_value > params.committee_threshold"
        next: manual_review
    default: approve
