# Document verification (KYC). Shows list aggregation over documents and
# expiry rules evaluated against the request's pinned evaluation date.
workflow: document_verification
version: 1
owner: compliance
description: Identity document verification with expiry, issuing-country and authenticity checks.

input_schema:
  type: object
  additionalProperties: false
  required: [subject_id, documents]
  properties:
    subject_id: {type: string, minLength: 3}
    documents:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: object
        additionalProperties: false
        required: [type, number, expiry_date, issuing_country]
        properties:
          type: {enum: [passport, national_id, driving_licence, utility_bill]}
          number: {type: string, minLength: 4}
          expiry_date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
          issuing_country: {type: string, pattern: "^[A-Z]{2}$"}

parameters:
  min_validity_days: 30
  accepted_countries: [IN, US, GB, SG, AE]
  min_confidence: 0.9

dependencies:
  verifier:
    type: document_verifier
    timeout_ms: 1500
    retry: {max_attempts: 3, base_delay_ms: 100, max_delay_ms: 600}

stages:
  - id: document_checks
    type: rules
    rules:
      - id: KYC-001
        name: Photo ID present
        kind: mandatory
        condition: "count_where(input.documents, 'type', 'passport') + count_where(input.documents, 'type', 'national_id') + count_where(input.documents, 'type', 'driving_licence') >= 1"
        on_fail: reject
        reason: "At least one photo ID (passport, national ID or driving licence) is required"
      - id: KYC-002
        name: No expired or soon-expiring documents
        kind: threshold
        condition: "days_until(min(pluck(input.documents, 'expiry_date'))) >= params.min_validity_days"
        on_fail: reject
        reason: "A document expires within {params.min_validity_days} days of evaluation"
      - id: KYC-003
        name: Issuing country accepted
        kind: mandatory
        condition: "all_where(input.documents, 'issuing_country', input.documents[0].issuing_country) and input.documents[0].issuing_country in params.accepted_countries"
        on_fail: review
        reason: "Documents issued by unsupported or mixed countries need manual review"
    next: authenticity

  - id: authenticity
    type: dependency
    dependency: verifier
    request:
      documents: "input.documents"
    output_key: verification
    on_unavailable: retry_later
    on_error: manual_review
    next: authenticity_rules

  - id: authenticity_rules
    type: rules
    rules:
      - id: KYC-101
        name: All documents authentic
        kind: mandatory
        condition: "verification.all_verified"
        on_fail: reject
        reason: "Verifier could not authenticate every document"
      - id: KYC-102
        name: High confidence
        kind: threshold
        condition: "verification.min_confidence >= params.min_confidence"
        on_fail: review
        reason: "Verification confidence {verification.min_confidence} below {params.min_confidence}"
    next: approve
